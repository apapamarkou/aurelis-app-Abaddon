name: Aurelis-application AppImage Build
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
on:
  schedule:
    - cron: "0 7 1/21 * *" # We default to rebuilding every 21 days, change this to your liking
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check if tag exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP '(?<=version-)[^-]+(?=-blue)' README.md)
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [check]
    if: ${{ needs.check.outputs.skip == 'false' }}
    name: "${{ matrix.name }} (${{ matrix.arch }})"
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-latest
            name: Build AppImage
            arch: x86_64
    container: ghcr.io/${{ github.repository_owner }}/archlinux:latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Dependencies
        run: /bin/sh ./get-dependencies.sh
      - name: Make AppImage
        run: /bin/sh ./make-appimage.sh
      - name: Generate SHA
        run: |
          cd dist
          for f in *.AppImage; do
            sha256sum "$f" > "${f}.sha256"
          done
      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: AppImage-${{ matrix.arch }}
          path: dist

  release:
    if: ${{ github.ref_name == 'master' && needs.check.outputs.skip == 'false' }}
    needs: [check, build]
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: AppImage-*
          merge-multiple: true
      - name: Remove unwanted files
        run: rm -f *.zsync
      - name: Read appinfo
        shell: sh
        run: |
          APPNAME=$(awk -F'=' '/X-AppImage-Name/{print $2; exit}' ./appinfo)
          VERSION=$(awk -F'=' '/X-AppImage-Version/{print $2; exit}' ./appinfo)
          echo "APPNAME=$APPNAME" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Generate links file
        env:
          VERSION: "${{ env.VERSION }}"
          OUTDIR: "."
        run: /bin/sh ./export-links.sh
      - name: Release Artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(find . -maxdepth 1 -type f \( \
            -name '*.AppImage' -o \
            -name '*.AppImage.sha256' -o \
            -name 'app.info' -o \
            -name 'app.links' -o \
            -name '*.desktop' -o \
            -name '*.svg' -o \
            -name '*.png' \
          \) | sort)
          gh release create "${{ env.VERSION }}" \
            --title "${{ env.APPNAME }}: ${{ env.VERSION }}" \
            --latest \
            $files
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Update LATEST_VERSION
        shell: sh
        run: |
          echo "${{ env.VERSION }}" > ./LATEST_VERSION
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ./LATEST_VERSION
          git commit --allow-empty -m 'bump `LATEST_VERSION` [skip ci] ${{ env.VERSION }}'
          git push
